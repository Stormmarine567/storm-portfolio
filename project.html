<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Project | Ikpotokin Miracle</title>
  <meta name="theme-color" content="#0a0a0a">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230a0a0a'/%3E%3Ctext x='16' y='23' text-anchor='middle' font-family='Arial' font-weight='900' font-size='20' fill='%23fbbd23'%3ES%3C/text%3E%3C/svg%3E">
  <link rel="preload" href="/assets/fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <script>
    (function () {
      try {
        var t = localStorage.getItem('storm_theme'); if (t) document.documentElement.setAttribute('data-theme', t);
        var a = { amber: '#fbbd23', blue: '#3c83f6', green: '#21c45d', purple: '#9b5bf5', rose: '#e5345a', cyan: '#10b5cb' }[localStorage.getItem('storm_accent')];
        if (a) {
          var r = document.documentElement.style;
          r.setProperty('--accent', a);
          r.setProperty('--accent-rgb', parseInt(a.slice(1, 3), 16) + ',' + parseInt(a.slice(3, 5), 16) + ',' + parseInt(a.slice(5, 7), 16));
        }
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
  <main class="pj" id="project">
    <a class="pj-back" href="/" id="backLink">Back to Home Page</a>
    <div id="projectBody"></div>
  </main>
  <footer class="site-footer" id="footer"></footer>

  <script src="/assets/js/common.js"></script>
  <script src="/assets/js/project.js"></script>
</body>
</html>
